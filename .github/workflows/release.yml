name: release

# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored in this
# repository. Before the first run, declare a pending publisher on PyPI with
#   owner: Najim33 · repository: GRsuite · workflow: release.yml · environment: pypi
# and the same on test.pypi.org with environment: testpypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, none]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[test]"

      - name: Run the airGR comparison test suite
        run: pytest

      - name: Check that the version tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import grsuite; print(grsuite.__version__)")
          echo "tag $tagged, package $packaged"
          test "$tagged" = "$packaged"

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Validate the distributions and the rendered README
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    # Dry run: the same artefacts, published where a mistake costs nothing.
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/grsuite
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    # A version published here can never be replaced, only superseded.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/grsuite
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
