[build-system]
# setuptools >= 77 : requis par la licence en expression SPDX et `license-files`
# (PEP 639), qui produisent les metadonnees 2.4 attendues par PyPI.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grsuite"
version = "1.0.0"
description = "Unofficial, independent Python port of the airGR suite of GR rainfall-runoff models, validated against airGR"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Najim Bouhafa", email = "najimbouhafa@gmail.com" }]
keywords = [
    "hydrology", "rainfall-runoff", "GR4J", "GR5J", "GR6J", "GR2M", "GR1A",
    "GR4H", "GR5H", "CemaNeige", "airGR", "snow", "streamflow", "calibration",
    "conceptual model", "water resources", "flood forecasting",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.22",
    "numba>=0.57",
]

[project.optional-dependencies]
io = ["pandas>=1.5"]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7.0", "pandas>=1.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "ruff>=0.5",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/Najim33/GRsuite"
Documentation = "https://github.com/Najim33/GRsuite/tree/main/docs"
Repository = "https://github.com/Najim33/GRsuite"
Issues = "https://github.com/Najim33/GRsuite/issues"
Changelog = "https://github.com/Najim33/GRsuite/blob/main/CHANGELOG.md"
"Validation report" = "https://github.com/Najim33/GRsuite/blob/main/docs/VALIDATION.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grsuite = ["data/*.csv"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E741",   # noyaux traduits du Fortran : les noms de variables sont ceux du modele
    "N806",
    "UP031",  # le formatage % est le style uniforme du paquet
    # Les branches de crit.py, calib.py, models.py et aggreg.py reprennent une a
    # une celles des sources R d'airGR : les fusionner ferait perdre la
    # correspondance ligne a ligne (voir CONTRIBUTING.md).
    "SIM102",
    "SIM108",
    "SIM114",
]

[tool.ruff.lint.per-file-ignores]
"src/grsuite/_kernels.py" = ["E501", "N", "SIM"]
"src/grsuite/_kernels_h.py" = ["E501", "N", "SIM"]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["grsuite"]
omit = ["*/_kernels*.py"]
